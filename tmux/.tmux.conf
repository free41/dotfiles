# ============================================================================
# TMUX CONFIGURATION
# ============================================================================

# ----------------------------------------------------------------------------
# General Settings
# ----------------------------------------------------------------------------

# Change prefix from Ctrl+b to Ctrl+a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Enable mouse support (scrolling, selecting panes, resizing, selecting windows)
set -g mouse on

# Increase scrollback buffer size
set-option -g history-limit 50000

# Start window and pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Enable true color support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Faster command sequences (no delay for escape key)
set -s escape-time 0

# Focus events enabled for terminals that support them
set -g focus-events on

# Automatically rename windows based on current directory and command
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}:#{pane_current_command}'

# ----------------------------------------------------------------------------
# Window and Pane Management
# ----------------------------------------------------------------------------

# Create new windows in current path
bind c new-window -c "#{pane_current_path}"

# Split panes (matching vim Ctrl+w bindings)
bind s split-window -v -c "#{pane_current_path}"    # Horizontal split (Prefix s)
bind v split-window -h -c "#{pane_current_path}"    # Vertical split (Prefix v)
unbind '"'
unbind %

# Window/Pane management (matching vim Ctrl+w bindings)
bind q kill-pane                                     # Close current pane (Prefix q)
bind 0 select-window -t :=0                          # Go to window 0 (Prefix 0)
bind = select-layout even-horizontal                 # Equalize panes (Prefix =)
bind _ resize-pane -Z                                # Maximize/zoom pane (Prefix _)

# Reload config file
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# ----------------------------------------------------------------------------
# Navigation (vim-tmux-navigator integration)
# ----------------------------------------------------------------------------

# Smart pane switching with awareness of Vim splits
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n C-h if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n C-j if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n C-k if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n C-l if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

# Restore clear screen keybind mapped to <prefix> C-l
bind C-l send-keys 'C-l'

# ----------------------------------------------------------------------------
# Copy Mode (Vi-style)
# ----------------------------------------------------------------------------

# Use vi-style keys in copy mode
setw -g mode-keys vi

# Enter copy mode with Prefix + [ (standard tmux binding)
# Or use Prefix + a (double-tap Ctrl+a for convenience)
bind a copy-mode  # Prefix + a to enter copy mode (double-tap Ctrl+a)

# In copy mode, use 'v' to begin selection and 'y' to yank
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Copy to system clipboard (requires xclip on Linux/WSL)
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"

# Paste with Prefix + p
bind p paste-buffer

# Unbind Escape in copy mode to avoid conflicts with Vim
unbind -T copy-mode-vi Escape
# Use 'q' to exit copy mode instead
bind -T copy-mode-vi q send-keys -X cancel

# ----------------------------------------------------------------------------
# Status Bar - Everforest Dark Medium Theme
# ----------------------------------------------------------------------------
# Everforest Dark Medium color palette:
# Background: #2d353b (dark bg), #343f44 (bg0), #3d484d (bg1)
# Foreground: #d3c6aa (fg)
# Green: #a7c080, #83c092
# Yellow: #dbbc7f
# Blue: #7fbbb3
# Red: #e67e80
# Grey: #859289, #9da9a0

# Status bar position
set-option -g status-position bottom

# Status bar colors
set-option -g status-style bg=#343f44,fg=#d3c6aa

# Status bar - left side (session name only)
set-option -g status-left-length 50
set-option -g status-left "#[fg=#2d353b,bg=#a7c080,bold] #S #[fg=#a7c080,bg=#343f44] "

# Status bar - right side (git branch, username@hostname, date and time)
set-option -g status-right-length 150
set-option -g status-right "#[fg=#859289,bg=#343f44]#(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD 2>/dev/null | sed 's/.*/ &/')#[fg=#e67e80]#(cd #{pane_current_path}; git status --porcelain 2>/dev/null | grep -q . && echo '*')#[fg=#7fbbb3]#(cd #{pane_current_path}; git rev-list --left-right --count @{upstream}...HEAD 2>/dev/null | awk '{if($1>0) printf \" ↓\"$1; if($2>0) printf \" ↑\"$2}') #[fg=#7fbbb3,bg=#343f44] #(whoami)@#H #[fg=#3d484d,bg=#343f44]#[fg=#d3c6aa,bg=#3d484d] %a %Y-%m-%d #[fg=#83c092,bg=#3d484d]#[fg=#2d353b,bg=#83c092,bold] %H:%M "

# Window status format (inactive windows)
set-option -g window-status-format "#[fg=#d3c6aa,bg=#343f44]  #I:#W  "

# Window status format (active window)
set-option -g window-status-current-format "#[fg=#2d353b,bg=#a7c080,bold]  #I:#W  "

# Window status separator
set-option -g window-status-separator ""

# Pane border colors
set-option -g pane-border-style fg=#3d484d
set-option -g pane-active-border-style fg=#a7c080

# Message style (displayed when running commands)
set-option -g message-style bg=#dbbc7f,fg=#2d353b,bold

# Command message style
set-option -g message-command-style bg=#343f44,fg=#d3c6aa

# Pane number display colors
set-option -g display-panes-active-colour "#a7c080"
set-option -g display-panes-colour "#859289"

# Clock mode color
set-option -g clock-mode-colour "#7fbbb3"

# Copy mode highlighting
set-option -g mode-style bg=#3d484d,fg=#d3c6aa

