# ============================================================================
# TMUX CONFIGURATION
# ============================================================================

# ----------------------------------------------------------------------------
# General Settings
# ----------------------------------------------------------------------------

# Change prefix from Ctrl+b to Ctrl+a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Enable mouse support (scrolling, selecting panes, resizing, selecting windows)
set -g mouse on

# Increase scrollback buffer size
set-option -g history-limit 50000

# Start window and pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# True color support
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set-environment -g COLORTERM truecolor

# Faster command sequences (no delay for escape key)
set -s escape-time 0

# Focus events enabled for terminals that support them (needed for vim autoread)
set -g focus-events on

# Automatically rename windows based on current directory and command
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}:#{pane_current_command}'

# ----------------------------------------------------------------------------
# Window and Pane Management
# ----------------------------------------------------------------------------

# Create new windows in home directory
bind c new-window -c ~

# Split panes (matching vim Ctrl+w bindings)
bind s split-window -v -c "#{pane_current_path}"    # Horizontal split (Prefix s)
bind v split-window -h -c "#{pane_current_path}"    # Vertical split (Prefix v)
unbind '"'
unbind %

# Window/Pane management (matching vim Ctrl+w bindings)
bind q kill-pane                                     # Close current pane (Prefix q)
bind 0 select-window -t :=0                          # Go to window 0 (Prefix 0)
bind = select-layout even-horizontal                 # Equalize panes (Prefix =)
bind _ resize-pane -Z                                # Maximize/zoom pane (Prefix _)

# Reload config file
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Quick window switching with h/l (vim-style)
bind h previous-window
bind l next-window

# ----------------------------------------------------------------------------
# Navigation (vim-tmux-navigator integration)
# ----------------------------------------------------------------------------

# Smart pane switching with awareness of Vim splits
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?nvim?x?|vim?x?)(diff)?$'"

bind-key -n C-h if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n C-j if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n C-k if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n C-l if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

# Restore clear screen keybind mapped to <prefix> C-l
bind C-l send-keys 'C-l'

# ----------------------------------------------------------------------------
# Copy Mode (Vi-style)
# ----------------------------------------------------------------------------

# Use vi-style keys in copy mode
setw -g mode-keys vi

# Enter copy mode with Prefix + [ (standard tmux binding)
bind a copy-mode  # double-tap Ctrl+a to enter copy mode

# In copy mode: 'v' to begin selection, 'y' to yank
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"

# Paste with Prefix + p
bind p paste-buffer

# Use 'q' to exit copy mode
unbind -T copy-mode-vi Escape
bind -T copy-mode-vi q send-keys -X cancel

# ----------------------------------------------------------------------------
# Nord Color Scheme (inline — no TPM required)
# Nord palette:
#   nord0=#2E3440  nord1=#3B4252  nord2=#434C5E  nord3=#4C566A
#   nord4=#D8DEE9  nord5=#E5E9F0  nord6=#ECEFF4
#   nord7=#8FBCBB  nord8=#88C0D0  nord9=#81A1C1  nord10=#5E81AC
#   nord11=#BF616A nord12=#D08770 nord13=#EBCB8B
#   nord14=#A3BE8C nord15=#B48EAD
# ----------------------------------------------------------------------------

set -g status-interval 1
set -g status on
set -g status-justify left

# Status bar background/foreground
set -g status-style "bg=#3B4252,fg=#D8DEE9"

# Status left: session name with powerline arrow
set -g status-left "#[bg=#5E81AC,fg=#ECEFF4,bold] #S #[bg=#3B4252,fg=#5E81AC,nobold]"
set -g status-left-length 20

# Status right: two powerline segments — time (nord3) → date (nord10)
set -g status-right "#[fg=#4C566A,bg=#3B4252]#[fg=#D8DEE9,bg=#4C566A] %H:%M #[fg=#5E81AC,bg=#4C566A]#[fg=#ECEFF4,bg=#5E81AC,bold] %a %d %b "
set -g status-right-length 50

# Window status
set -g window-status-format "  #[fg=#616E88]#W  "
set -g window-status-current-format "#[fg=#88C0D0,bg=#3B4252]#[fg=#2E3440,bg=#88C0D0,bold] #W #[nobold,bg=#3B4252,fg=#88C0D0]"
set -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#3B4252"
set -g pane-active-border-style "fg=#5E81AC"

# Messages
set -g message-style "bg=#3B4252,fg=#88C0D0"
set -g message-command-style "bg=#3B4252,fg=#88C0D0"

# Copy mode highlight
setw -g mode-style "bg=#5E81AC,fg=#ECEFF4"

# Clock
setw -g clock-mode-colour "#88C0D0"
