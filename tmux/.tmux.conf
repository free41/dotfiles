# ============================================================================
# TMUX CONFIGURATION
# ============================================================================

# ----------------------------------------------------------------------------
# General Settings
# ----------------------------------------------------------------------------

# Change prefix from Ctrl+b to Ctrl+a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Enable mouse support (scrolling, selecting panes, resizing, selecting windows)
set -g mouse on

# Increase scrollback buffer size
set-option -g history-limit 50000

# Start window and pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Update these environment variables when attaching to a session
set -g update-environment "COLORTERM"

# Faster command sequences (no delay for escape key)
set -s escape-time 0

# Focus events enabled for terminals that support them (needed for vim autoread)
set -g focus-events on

# Automatically rename windows based on current directory and command
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}:#{pane_current_command}'

# ----------------------------------------------------------------------------
# Window and Pane Management
# ----------------------------------------------------------------------------

# Create new windows in current path
bind c new-window -c "#{pane_current_path}"

# Split panes (matching vim Ctrl+w bindings)
bind s split-window -v -c "#{pane_current_path}"    # Horizontal split (Prefix s)
bind v split-window -h -c "#{pane_current_path}"    # Vertical split (Prefix v)
unbind '"'
unbind %

# Window/Pane management (matching vim Ctrl+w bindings)
bind q kill-pane                                     # Close current pane (Prefix q)
bind 0 select-window -t :=0                          # Go to window 0 (Prefix 0)
bind = select-layout even-horizontal                 # Equalize panes (Prefix =)
bind _ resize-pane -Z                                # Maximize/zoom pane (Prefix _)

# Reload config file
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Quick window switching with h/l (vim-style, left hand only)
bind h previous-window
bind l next-window

# ----------------------------------------------------------------------------
# Navigation (vim-tmux-navigator integration)
# ----------------------------------------------------------------------------

# Smart pane switching with awareness of Vim splits
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n C-h if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n C-j if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n C-k if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n C-l if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

# Restore clear screen keybind mapped to <prefix> C-l
bind C-l send-keys 'C-l'

# ----------------------------------------------------------------------------
# Copy Mode (Vi-style)
# ----------------------------------------------------------------------------

# Use vi-style keys in copy mode
setw -g mode-keys vi

# Enter copy mode with Prefix + [ (standard tmux binding)
# Or use Prefix + a (double-tap Ctrl+a for convenience)
bind a copy-mode  # Prefix + a to enter copy mode (double-tap Ctrl+a)

# In copy mode, use 'v' to begin selection and 'y' to yank
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Copy to system clipboard (requires xclip on Linux/WSL)
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"

# Paste with Prefix + p
bind p paste-buffer

# Unbind Escape in copy mode to avoid conflicts with Vim
unbind -T copy-mode-vi Escape
# Use 'q' to exit copy mode instead
bind -T copy-mode-vi q send-keys -X cancel

# ----------------------------------------------------------------------------
# Plugins (TPM - Tmux Plugin Manager)
# ----------------------------------------------------------------------------

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'arcticicestudio/nord-tmux'

# Initialize TPM (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
